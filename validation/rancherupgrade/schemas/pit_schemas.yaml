- projects: [RANCHERINT]
  suite: Rancher Upgrade/Longhorn
  cases:
  - title: "Longhorn pre-upgrade setup"
    description: "Install Longhorn and seed a checksum workload on a Longhorn volume before the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Create a project on the Rancher local cluster"
      data: ""
      expectedresult: "The project is created successfully"
      position: 1
    - action: "Install the Longhorn chart at the latest version offered by the pre-upgrade Rancher"
      data: "Chart: longhorn from the rancher-charts repo"
      expectedresult: "Longhorn installs and its deployments and daemonsets become Ready"
      position: 2
    - action: "Create the checksum workload on a Longhorn-backed PVC"
      data: "1GiB PVC and nginx deployment named rancher-upgrade-longhorn with data file /auto-mnt/checksum-data"
      expectedresult: "PVC is Bound, deployment rolls out, and the checksum data is written to the Longhorn volume"
      position: 3
    custom_field:
      "15": "TestLonghornPreUpgrade"
  - title: "Longhorn post-upgrade validation"
    description: "Verify Longhorn and its volume data survive the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Check the Longhorn chart installation state"
      data: "Chart: longhorn in longhorn-system"
      expectedresult: "The chart is still installed"
      position: 2
    - action: "Verify the checksum workload on the Longhorn volume"
      data: "PVC rancher-upgrade-longhorn and data file /auto-mnt/checksum-data"
      expectedresult: "PVC is Bound and the sha256 of the data file matches the pre-upgrade content"
      position: 3
    custom_field:
      "15": "TestLonghornPostUpgrade"
  - title: "Longhorn chart upgrade after Rancher upgrade"
    description: "Upgrade Longhorn to the version offered by the upgraded Rancher catalog and verify workload data"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Resolve the latest Longhorn chart version from the cluster-scoped catalog"
      data: "Chart: longhorn from the rancher-charts repo"
      expectedresult: "The latest cluster-scoped chart version is resolved and differs from the installed pre-upgrade version"
      position: 2
    - action: "Upgrade the Longhorn chart with retry"
      data: "longhorn and longhorn-crd to the latest version"
      expectedresult: "The longhorn chart reaches Deployed state and workloads become Ready"
      position: 3
    - action: "Verify the chart version and the checksum workload"
      data: "Chart version equals latest; PVC rancher-upgrade-longhorn and data file /auto-mnt/checksum-data"
      expectedresult: "Installed chart version matches latest and the sha256 of the data file still matches the pre-upgrade content"
      position: 4
    custom_field:
      "15": "TestLonghornChartUpgrade"

- projects: [RANCHERINT]
  suite: Rancher Upgrade/NeuVector
  cases:
  - title: "NeuVector pre-upgrade setup"
    description: "Install NeuVector and prove admission control enforcement before the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Resolve the System project on the Rancher local cluster"
      data: "Project: System"
      expectedresult: "The System project is resolved for the chart install"
      position: 1
    - action: "Install the NeuVector chart at the latest version offered by the pre-upgrade Rancher"
      data: "Chart: neuvector and neuvector-crd from the rancher-charts repo in cattle-neuvector-system"
      expectedresult: "NeuVector installs and its deployments and daemonsets become Ready"
      position: 2
    - action: "Enable the NeuVector admission control deny rule"
      data: "NvAdmissionControlSecurityRule named local in protect mode denying workload creates in namespace rancher-upgrade-neuvector-deny"
      expectedresult: "The custom resource is applied and the neuvector-validating-admission-webhook ValidatingWebhookConfiguration exists"
      position: 3
    - action: "Prove the admission webhook denies a known-bad create"
      data: "Pod create in namespace rancher-upgrade-neuvector-deny"
      expectedresult: "The create is rejected with an admission webhook denial"
      position: 4
    custom_field:
      "15": "TestNeuVectorPreUpgrade"
  - title: "NeuVector post-upgrade validation"
    description: "Verify NeuVector services, manager UI and admission enforcement survive the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Check the NeuVector chart installation state"
      data: "Chart: neuvector in cattle-neuvector-system"
      expectedresult: "The chart is still installed"
      position: 2
    - action: "Verify the NeuVector services are active"
      data: "neuvector-service-webui, neuvector-svc-controller, neuvector-svc-admission-webhook"
      expectedresult: "All expected NeuVector services exist and are active"
      position: 3
    - action: "Verify the NeuVector manager web UI is reachable"
      data: "Rancher service proxy path for neuvector-service-webui port 8443"
      expectedresult: "The manager web UI responds through the Rancher service proxy"
      position: 4
    - action: "Verify the admission webhook still denies the known-bad create"
      data: "Pod create in namespace rancher-upgrade-neuvector-deny"
      expectedresult: "The create is rejected with an admission webhook denial"
      position: 5
    custom_field:
      "15": "TestNeuVectorPostUpgrade"
  - title: "NeuVector chart upgrade after Rancher upgrade"
    description: "Upgrade NeuVector to the version offered by the upgraded Rancher catalog and re-verify health and enforcement"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Resolve the latest NeuVector chart version from the cluster-scoped catalog"
      data: "Chart: neuvector from the rancher-charts repo"
      expectedresult: "The latest cluster-scoped chart version is resolved and differs from the installed pre-upgrade version"
      position: 2
    - action: "Upgrade the NeuVector chart with retry, preserving the installed release values"
      data: "neuvector and neuvector-crd to the latest version, reusing the installed App values"
      expectedresult: "The neuvector chart reaches Deployed state and workloads become Ready"
      position: 3
    - action: "Verify the chart version, service health and admission enforcement"
      data: "Chart version equals latest; NeuVector services active; pod create in namespace rancher-upgrade-neuvector-deny denied"
      expectedresult: "Installed chart version matches latest, all expected services are active and the admission webhook still denies the create"
      position: 4
    custom_field:
      "15": "TestNeuVectorChartUpgrade"

- projects: [RANCHERINT]
  suite: Rancher Upgrade/Fleet
  cases:
  - title: "Fleet pre-upgrade setup"
    description: "Seed a Fleet GitRepo backed by a node-local SSH git remote and record the pre-upgrade fleet versions"
    automation: 2
    steps:
    - action: "Create an SSH node and the fleet SSH auth secret on the target cluster"
      data: "Secret rancher-upgrade-fleet-ssh in fleet-default holding the node key pair and known_hosts"
      expectedresult: "The SSH secret is created and the node is reachable over SSH"
      position: 1
    - action: "Clone the fleet-examples repository on the SSH node"
      data: "git clone https://github.com/rancher/fleet-examples into ~/rancher-upgrade-fleet-repo"
      expectedresult: "The clone succeeds and doubles as the SSH-served git remote"
      position: 2
    - action: "Create the target namespace on the target cluster"
      data: "Namespace rancher-upgrade-fleet-target"
      expectedresult: "The namespace exists on the target cluster"
      position: 3
    - action: "Create the Fleet GitRepo and wait for its initial sync"
      data: "GitRepo rancher-upgrade-fleet-gitrepo in fleet-default tracking the node-local remote, branch master, path simple"
      expectedresult: "The GitRepo reaches an active state and deploys the example bundle on the target cluster"
      position: 4
    - action: "Record the pre-upgrade fleet state"
      data: "ConfigMap rancher-upgrade-fleet-state in fleet-default with fleet-controller version, fleet-agent version and the synced commit SHA"
      expectedresult: "The state ConfigMap is created for the post-upgrade phase"
      position: 5
    custom_field:
      "15": "TestFleetPreUpgrade"
  - title: "Fleet post-upgrade validation"
    description: "Verify Fleet keeps reconciling git commits across the Rancher server upgrade and that fleet-controller and fleet-agent upgrade in lockstep"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Load the pre-upgrade fleet state"
      data: "ConfigMap rancher-upgrade-fleet-state in fleet-default"
      expectedresult: "The recorded controller version, agent version and commit SHA are present"
      position: 2
    - action: "Verify the GitRepo is still in sync after the upgrade"
      data: "GitRepo rancher-upgrade-fleet-gitrepo"
      expectedresult: "The GitRepo and its bundle resources on the target cluster are still active"
      position: 3
    - action: "Push a new commit and verify the full reconcile loop"
      data: "Empty commit on the node-local clone, then wait for the new commit SHA and bundle Ready state"
      expectedresult: "Fleet fetches the new commit and redeploys the bundle resources on the target cluster"
      position: 4
    - action: "Verify the fleet-controller and fleet-agent upgraded in lockstep"
      data: "fleet-controller on local and fleet-agent on the target cluster via their deployment images"
      expectedresult: "Both versions differ from the pre-upgrade recordings and equal each other"
      position: 5
    custom_field:
      "15": "TestFleetPostUpgrade"

- projects: [RANCHERINT]
  suite: Rancher Upgrade/Observability
  cases:
  - title: "SUSE Observability pre-upgrade setup"
    description: "Install the SUSE Observability server and a stackstate agent reporting to it before the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Ensure the prime server-charts ClusterRepo exists on the local cluster"
      data: "ClusterRepo suse-observability at https://charts.rancher.com/server-charts/prime/suse-observability"
      expectedresult: "The ClusterRepo is available to the cluster-scoped catalog"
      position: 1
    - action: "Install the suse-observability server chart in the System project on the local cluster"
      data: "Chart: suse-observability at the latest cluster-scoped version with base, ingress and 150-ha sizing values"
      expectedresult: "The chart reaches Deployed state, its deployments and daemonsets become Ready, and its pods are healthy"
      position: 2
    - action: "Install the stackstate agent chart on the shared downstream cluster"
      data: "Chart: stackstate-k8s-agent from rancher-partner-charts with cluster, apiKey and url values from stackstateConfigs"
      expectedresult: "The chart reaches Deployed state, its deployments and daemonsets become Ready, and its pods are healthy"
      position: 3
    - action: "Verify the agent is reporting to the server"
      data: "Agent workloads ready in the stackstate namespace on the downstream cluster"
      expectedresult: "The agent pods stay healthy against the server URL, seeding pre-upgrade monitoring state"
      position: 4
    custom_field:
      "15": "TestObservabilityPreUpgrade"
  - title: "SUSE Observability post-upgrade validation"
    description: "Verify the SUSE Observability server stays healthy and agents keep reporting across the Rancher server upgrade"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Check the suse-observability server chart installation state"
      data: "Chart: suse-observability in the suse-observability namespace on the local cluster"
      expectedresult: "The chart is still installed"
      position: 2
    - action: "Verify the server workloads are healthy"
      data: "Deployments and daemonsets in the suse-observability namespace on the local cluster"
      expectedresult: "All deployments and daemonsets reach their expected replicas and the server pods are healthy"
      position: 3
    - action: "Verify monitoring continuity via the agent"
      data: "Chart: stackstate-k8s-agent in the stackstate namespace on the downstream cluster"
      expectedresult: "The agent chart is still installed, its workloads are Ready, and its pods are healthy and reporting"
      position: 4
    custom_field:
      "15": "TestObservabilityPostUpgrade"
  - title: "SUSE Observability chart upgrade after Rancher upgrade"
    description: "Upgrade the suse-observability server and stackstate agent charts to the versions offered by the upgraded Rancher catalog and re-verify health"
    automation: 2
    steps:
    - action: "Wait for the Rancher server to report the upgraded version"
      data: "rancherUpgradeInput.targetVersion"
      expectedresult: "The server-version setting equals the target version"
      position: 1
    - action: "Resolve the latest server and agent chart versions from the cluster-scoped catalogs"
      data: "suse-observability from the prime server-charts ClusterRepo on the local cluster; stackstate-k8s-agent from rancher-partner-charts on the downstream cluster"
      expectedresult: "The latest cluster-scoped versions are resolved and differ from the installed pre-upgrade versions"
      position: 2
    - action: "Upgrade the suse-observability server chart with the install-time values"
      data: "Base, ingress and 150-ha sizing values re-applied to avoid dropping the HA profile and service credentials"
      expectedresult: "The server chart reaches Deployed state at the latest version and its workloads become Ready"
      position: 3
    - action: "Upgrade the stackstate agent chart"
      data: "stackstate-k8s-agent upgraded to the latest version with cluster, apiKey and url values"
      expectedresult: "The agent chart reaches Deployed state at the latest version and its workloads become Ready"
      position: 4
    - action: "Verify post-upgrade health and reporting"
      data: "Server and agent chart versions equal the resolved latest versions"
      expectedresult: "Both charts report the latest versions and the agent pods are healthy and reporting to the server"
      position: 5
    custom_field:
      "15": "TestObservabilityChartUpgrade"
